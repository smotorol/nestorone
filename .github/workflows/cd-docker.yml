name: cd-docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 메타데이터 생성(API)
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-orderinventory-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha

      - name: 메타데이터 생성(DbMigrator)
        id: migrator-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-orderinventory-db-migrator
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha

      - name: API 이미지 발행
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/OrderInventory.Api/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}

      - name: DbMigrator 이미지 발행
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/OrderInventory.DbMigrator/Dockerfile
          push: true
          tags: ${{ steps.migrator-meta.outputs.tags }}
          labels: ${{ steps.migrator-meta.outputs.labels }}
